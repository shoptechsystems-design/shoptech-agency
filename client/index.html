<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>ShopTech Systems</title>
    <!--head-tags-->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/shoptech-mark.png" />

    <!-- Google AdSense: the account meta tag verifies the site; the ad script itself loads after the page is
         interactive so it never competes with our own content for bandwidth or the main thread. -->
    <meta name="google-adsense-account" content="ca-pub-1792652693299262" />
    <script>
      (function () {
        function load() {
          var s = document.createElement("script");
          s.async = true;
          s.crossOrigin = "anonymous";
          s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1792652693299262";
          document.head.appendChild(s);
        }
        window.addEventListener("load", function () {
          if ("requestIdleCallback" in window) requestIdleCallback(function () { setTimeout(load, 1500); }, { timeout: 4000 });
          else setTimeout(load, 3000);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
